services:
  mysql:
    image: mysql:8.4
    container_name: motor-co-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: motor_co
      MYSQL_USER: motor
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  mysql_data:
